[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-guitar-amp-bot"
version = "0.1.0"
description = "Streams a USB guitar amp or audio interface into Discord voice channels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "py-cord[voice]>=2.8.0",  # 2.8 adds DAVE E2EE; Discord rejects older clients with 4017
  "python-dotenv>=1.2.2",
  "pydantic-settings>=2.7.0",  # 2.7 adds NoDecode, used for INPUT_CHANNELS
  "sounddevice>=0.4.6",
  "numpy>=1.26.0",
]

[project.scripts]
guitar-amp-bot = "guitar_amp_bot.bot_sounddevice:main"
guitar-amp-bot-setup = "guitar_amp_bot.setup_wizard:main"
# Names from before the project was renamed, kept for existing setups.
blackstar-bot = "guitar_amp_bot.bot_sounddevice:main"
blackstar-bot-sd = "guitar_amp_bot.bot_sounddevice:main"
blackstar-bot-setup = "guitar_amp_bot.setup_wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_amp_bot"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "bandit[toml]>=1.9.4",
  "pre-commit>=3.7.0",
]

# -- Commitizen ---------------------------------------------------------------
# `cz bump` updates [project].version and tags vX.Y.Z, matching release.yml's
# trigger. CHANGELOG.md is written by hand, so bump leaves it alone.

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
update_changelog_on_bump = false

# -- Ruff ---------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations (type hints)
  "S",    # flake8-bandit (security)
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T20",  # flake8-print (ban bare print())
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "TCH",  # flake8-type-checking
  "RUF",  # ruff-specific rules
  "ASYNC",# flake8-async
]
ignore = [
  "S101",    # assert — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["guitar_amp_bot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -- mypy ----------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
# discord / sounddevice ship partial stubs — suppress missing-imports
module = ["discord.*", "sounddevice.*", "nacl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Bot modules interact heavily with untyped py-cord API
module = ["guitar_amp_bot.bot_sounddevice"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false

# -- pytest --------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "linux_audio: captures from a virtual Linux audio device; opt in with LINUX_AUDIO_TEST=1",
]
addopts = [
  "--cov=src/guitar_amp_bot",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=70",
  "-v",
]

# -- bandit --------------------------------------------------------------------

[tool.bandit]
targets = ["src"]
skips = ["B603", "B607"]
