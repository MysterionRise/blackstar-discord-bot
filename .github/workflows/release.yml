name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Notes come from the curated CHANGELOG.md section for this version; the
      # script fails if the tag does not match the pyproject.toml version.
      - name: Extract release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          generate_release_notes: false
